[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "civicnexus-agent"
version = "0.1.0"
description = "城市公共服务事项理解与多 Agent 协同系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jieba>=0.42,<1",
    "pyyaml>=6,<7",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    "rank-bm25>=0.2,<1",
    "redis>=5,<7",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
retrieval = [
    "chromadb>=0.5,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
